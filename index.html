<style>
/* ===== LIQUID GLASS — ICMVN SEDE ===== */

:root {
  /* Cores funcionais — mantidas */
  --green:   #16a34a;
  --green-l: rgba(22,163,74,0.12);
  --green-d: #14532d;
  --red:     #dc2626;
  --red-l:   rgba(220,38,38,0.12);
  --amber:   #d97706;
  --amber-l: rgba(217,119,6,0.12);
  --blue:    #2563eb;
  --blue-l:  rgba(37,99,235,0.12);

  /* Gradiente de fundo — tons neutros azul/verde suave */
  --bg-gradient:
    radial-gradient(circle at 10% 0%,   rgba(220,252,231,0.7) 0%, transparent 40%),
    radial-gradient(circle at 90% 10%,  rgba(219,234,254,0.6) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(240,253,244,0.5) 0%, transparent 50%),
    #f0f4f1;

  /* Glass */
  --glass-bg:        rgba(255,255,255,0.52);
  --glass-bg-strong: rgba(255,255,255,0.72);
  --glass-border:    rgba(255,255,255,0.88);
  --glass-highlight: rgba(255,255,255,0.75);
  --blur: 22px;

  /* Texto */
  --text:           #1c1c1e;
  --text-secondary: #3a3a40;
  --text-tertiary:  #8e8e93;
  --separator:      rgba(60,60,67,0.1);
  --fill:           rgba(120,120,128,0.08);

  /* Sombras */
  --shadow:          0 1px 2px rgba(0,30,10,0.04), 0 6px 20px rgba(0,30,10,0.07);
  --shadow-elevated: 0 8px 30px rgba(0,30,10,0.13), 0 2px 8px rgba(0,30,10,0.07);

  --radius:    20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-gradient:
      radial-gradient(circle at 10% 0%,   rgba(20,83,45,0.45) 0%, transparent 40%),
      radial-gradient(circle at 90% 10%,  rgba(30,58,90,0.35) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(15,40,20,0.4)  0%, transparent 50%),
      #090d0a;

    --glass-bg:        rgba(30,36,32,0.58);
    --glass-bg-strong: rgba(36,42,38,0.75);
    --glass-border:    rgba(255,255,255,0.1);
    --glass-highlight: rgba(255,255,255,0.06);

    --text:           #f2f2f7;
    --text-secondary: #aeaeb2;
    --text-tertiary:  #636366;
    --separator:      rgba(255,255,255,0.08);
    --fill:           rgba(255,255,255,0.07);

    --shadow:          0 1px 2px rgba(0,0,0,0.35), 0 6px 20px rgba(0,0,0,0.4);
    --shadow-elevated: 0 10px 36px rgba(0,0,0,0.6);

    --green-l: rgba(22,163,74,0.18);
    --red-l:   rgba(220,38,38,0.18);
    --amber-l: rgba(217,119,6,0.18);
    --blue-l:  rgba(37,99,235,0.18);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Sora', sans-serif;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
}

/* ===== HEADER ===== */
header {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
  color: var(--text);
  padding: 0 1.25rem;
  padding-top: env(safe-area-inset-top);
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: calc(56px + env(safe-area-inset-top));
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
header span { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

/* ===== NAV ===== */
nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  border-bottom: 1px solid var(--glass-border);
  position: sticky;
  top: calc(56px + env(safe-area-inset-top));
  z-index: 99;
}
.nav-btn {
  padding: 12px 4px 10px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.02em;
}
.nav-btn.active { color: var(--green); border-bottom-color: var(--green); }
.nav-btn svg { width: 20px; height: 20px; }

/* ===== MAIN ===== */
main { padding: 1rem; max-width: 640px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; }

/* ===== GLASS CARD ===== */
.card {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 1.25rem;
  margin-bottom: 1rem;
  position: relative;
  overflow: hidden;
}
/* brilho diagonal */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--glass-highlight) 0%, transparent 60%);
  border-radius: inherit;
  pointer-events: none;
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 1rem;
}

/* ===== STAT CHIPS ===== */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1rem; }
.stat {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: .875rem .75rem;
  position: relative;
  overflow: hidden;
}
.stat::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--glass-highlight) 0%, transparent 60%);
  pointer-events: none;
}
.stat-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat-value.green { color: var(--green); }
.stat-value.red   { color: var(--red); }
.stat-value.blue  { color: var(--blue); }

/* ===== FORMS ===== */
.form-group { margin-bottom: 1rem; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
input, select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xs);
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: border-color .15s, box-shadow .15s;
  appearance: none;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(22,163,74,.15);
}
textarea { resize: vertical; min-height: 72px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  border-radius: var(--radius-xs);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all .18s;
  letter-spacing: -0.01em;
}
.btn-primary {
  background: var(--green);
  color: #fff;
  width: 100%;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(22,163,74,0.35);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:active { transform: scale(.97); }
.btn-danger {
  background: var(--red-l);
  color: var(--red);
  padding: 6px 10px;
  font-size: 12px;
  backdrop-filter: blur(8px);
}
.btn-sm {
  background: var(--glass-bg);
  color: var(--text-secondary);
  border: 1px solid var(--glass-border);
  padding: 7px 14px;
  font-size: 12px;
  backdrop-filter: blur(12px);
}
.btn-export {
  background: var(--blue-l);
  color: var(--blue);
  backdrop-filter: blur(8px);
}

/* ===== TOGGLE TIPO ===== */
.toggle-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.toggle-opt { position: relative; }
.toggle-opt input { position: absolute; opacity: 0; }
.toggle-opt label {
  display: block;
  text-align: center;
  padding: 11px;
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius-xs);
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all .15s;
  color: var(--text-secondary);
}
.toggle-opt input:checked + label {
  border-color: var(--green);
  background: var(--green-l);
  color: var(--green);
  box-shadow: 0 0 0 1px var(--green);
}

/* ===== CULTO SELECTOR ===== */
.culto-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
.culto-opt { position: relative; }
.culto-opt input { position: absolute; opacity: 0; }
.culto-opt label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius-xs);
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: all .15s;
  color: var(--text-secondary);
}
.culto-opt input:checked + label {
  border-color: var(--blue);
  background: var(--blue-l);
  color: var(--blue);
  box-shadow: 0 0 0 1px var(--blue);
}

/* ===== LIST ITEMS ===== */
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--separator);
  gap: 8px;
}
.list-item:last-child { border-bottom: none; padding-bottom: 0; }
.item-info { flex: 1; min-width: 0; }
.item-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.item-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.item-value { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}
.badge-green { background: var(--green-l); color: var(--green); }
.badge-red   { background: var(--red-l);   color: var(--red); }
.badge-amber { background: var(--amber-l); color: var(--amber); }
.badge-blue  { background: var(--blue-l);  color: var(--blue); }

/* ===== MONTH SELECTOR ===== */
.month-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
.month-bar input[type=month] { flex: 1; font-variant-numeric: tabular-nums; font-size: 14px; }

/* ===== EMPTY STATE ===== */
.empty { text-align: center; padding: 2rem 1rem; color: var(--text-tertiary); font-size: 14px; }

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 12px 22px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-elevated);
  transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  z-index: 999;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ===== LOADING ===== */
.loading { text-align: center; padding: 2rem; color: var(--text-tertiary); }
.spinner {
  width: 24px; height: 24px;
  border: 2.5px solid var(--separator);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== SECTION SEPARATOR ===== */
.section-sep {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 1.5rem 0 .75rem;
}

/* ===== EXPORT PDF BUTTON ===== */
.btn-export-pdf {
  width: 100%;
  justify-content: center;
  margin-top: .5rem;
  background: var(--green);
  color: #fff;
  box-shadow: 0 4px 14px rgba(22,163,74,0.3);
}

/* ===== PDF MODAL ===== */
#pdf-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
#pdf-overlay.open { display: flex; }
#pdf-modal {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius) var(--radius) 0 0;
  box-shadow: var(--shadow-elevated);
  padding: 1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 540px;
}
.pdf-modal-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 1.25rem;
}
.btn-cancelar {
  display: block;
  width: 100%;
  text-align: center;
  padding: 12px;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .form-row { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(3, 1fr); }
  main { padding: .75rem; }
}
@media (max-width: 390px) {
  /* iPhone 13 mini / telas estreitas */
  .stat-value { font-size: 16px; }
  .nav-btn { font-size: 9px; padding: 10px 2px 8px; }
  .card { padding: 1rem; }
}
@media (max-width: 360px) {
  .stats-row { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 15px; }
}
</style>
</head>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ===== INIT SUPABASE =====
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== UTILITÁRIOS =====
const fmt = v => 'R$\u00a0' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('pt-BR') : '';

function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function getMesAtual() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

function mesParaRange(mes) {
  const [y, m] = mes.split('-').map(Number);
  const inicio = `${y}-${String(m).padStart(2,'0')}-01`;
  const fim = new Date(y, m, 0);
  const fimStr = `${y}-${String(m).padStart(2,'0')}-${String(fim.getDate()).padStart(2,'0')}`;
  return { inicio, fim: fimStr };
}

// ===== NAVEGAÇÃO =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'dashboard') loadDashboard();
  if (id === 'historico') loadHistorico();
  if (id === 'config') loadConfig();
  if (id === 'despesa') loadCategoriasSelect();
}

// ===== SETUP INICIAL =====
async function init() {
  document.getElementById('header-nome').textContent = NOME_IGREJA;

  // Datas padrão
  const hoje = new Date().toISOString().split('T')[0];
  document.getElementById('ent-data').value = hoje;
  document.getElementById('dep-data').value = hoje;
  document.getElementById('mes-filtro').value = getMesAtual();
  document.getElementById('hist-mes').value = getMesAtual();
  document.getElementById('mes-header').textContent = new Date().toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).toUpperCase();

  await loadCategoriasSelect();
  loadDashboard();
}

// ===== DASHBOARD =====
async function loadDashboard() {
  const mes = document.getElementById('mes-filtro').value;
  const { inicio, fim } = mesParaRange(mes);

  const [{ data: entradas }, { data: despesas }] = await Promise.all([
    db.from('entradas').select('*').gte('data', inicio).lte('data', fim),
    db.from('despesas').select('*, categorias(nome)').gte('data', inicio).lte('data', fim)
  ]);

  const totalEnt = (entradas||[]).reduce((s,e) => s + Number(e.valor), 0);
  const totalDep = (despesas||[]).reduce((s,d) => s + Number(d.valor), 0);
  const saldo = totalEnt - totalDep;

  document.getElementById('stat-entradas').textContent = fmt(totalEnt);
  document.getElementById('stat-despesas').textContent = fmt(totalDep);
  const saldoEl = document.getElementById('stat-saldo');
  saldoEl.textContent = fmt(saldo);
  saldoEl.className = 'stat-value ' + (saldo >= 0 ? 'green' : 'red');

  // Por culto
  const cultos = ['Domingo','Quarta-feira','Sábado'];
  const porCulto = cultos.map(c => ({
    culto: c,
    total: (entradas||[]).filter(e=>e.culto===c).reduce((s,e)=>s+Number(e.valor),0)
  }));
  const rcEl = document.getElementById('resumo-cultos');
  if (!entradas || entradas.length === 0) { rcEl.innerHTML = '<div class="empty">Nenhuma entrada neste mês</div>'; }
  else {
    rcEl.innerHTML = porCulto.map(c => `
      <div class="list-item">
        <div class="item-info"><div class="item-title">${c.culto}</div></div>
        <div class="item-value" style="color:var(--green)">${fmt(c.total)}</div>
      </div>`).join('');
  }

  // Por categoria
  const catMap = {};
  (despesas||[]).forEach(d => {
    const cat = d.categorias?.nome || 'Sem categoria';
    catMap[cat] = (catMap[cat]||0) + Number(d.valor);
  });
  const catEl = document.getElementById('resumo-categorias');
  if (!despesas || despesas.length === 0) { catEl.innerHTML = '<div class="empty">Nenhuma despesa neste mês</div>'; }
  else {
    catEl.innerHTML = Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([cat,val]) => `
      <div class="list-item">
        <div class="item-info"><div class="item-title">${cat}</div></div>
        <div class="item-value" style="color:var(--red)">${fmt(val)}</div>
      </div>`).join('');
  }

  // Dízimos
  const dizimos = (entradas||[]).filter(e => e.tipo === 'Dízimo').slice(0,10);
  const dzEl = document.getElementById('resumo-dizimos');
  if (dizimos.length === 0) { dzEl.innerHTML = '<div class="empty">Nenhum dízimo neste mês</div>'; }
  else {
    dzEl.innerHTML = dizimos.map(d => `
      <div class="list-item">
        <div class="item-info">
          <div class="item-title">${d.nome_dizimista||'Anônimo'}</div>
          <div class="item-sub">${fmtDate(d.data)} · ${d.culto}</div>
        </div>
        <div class="item-value" style="color:var(--green)">${fmt(d.valor)}</div>
      </div>`).join('');
  }
}

// ===== ENTRADA =====
function toggleMembro() {
  const isDizimo = document.querySelector('input[name=tipo]:checked').value === 'Dízimo';
  document.getElementById('grupo-membro').style.display = isDizimo ? 'block' : 'none';
}

async function loadMembrosSelect() {
  const { data } = await db.from('membros').select('*').eq('ativo', true).order('nome');
  const sel = document.getElementById('ent-membro');
  sel.innerHTML = '<option value="">— selecione —</option>';
  (data||[]).forEach(m => sel.innerHTML += `<option value="${m.id}">${m.nome}</option>`);
}

async function salvarEntrada() {
  const tipo  = document.querySelector('input[name=tipo]:checked').value;
  const culto = document.querySelector('input[name=culto]:checked').value;
  const data  = document.getElementById('ent-data').value;
  const valor = parseFloat(document.getElementById('ent-valor').value);
  const obs   = document.getElementById('ent-obs').value;
  const nomeDizimista = document.getElementById('ent-membro').value.trim() || null;

  if (!data || isNaN(valor) || valor <= 0) { toast('⚠️ Preencha data e valor'); return; }

  const { error } = await db.from('entradas').insert({
    data, culto, tipo, valor, observacao: obs,
    nome_dizimista: tipo==='Dízimo' ? nomeDizimista : null
  });

  if (error) { toast('Erro ao salvar: ' + error.message); return; }
  toast('✅ Entrada salva!');
  document.getElementById('ent-valor').value = '';
  document.getElementById('ent-obs').value = '';
}

// ===== DESPESA =====
async function loadCategoriasSelect() {
  const { data } = await db.from('categorias').select('*').order('nome');
  const sel = document.getElementById('dep-categoria');
  if (!sel) return;
  sel.innerHTML = '<option value="">— selecione —</option>';
  (data||[]).forEach(c => sel.innerHTML += `<option value="${c.id}">${c.nome}</option>`);
}

async function salvarDespesa() {
  const data       = document.getElementById('dep-data').value;
  const valor      = parseFloat(document.getElementById('dep-valor').value);
  const catId      = document.getElementById('dep-categoria').value || null;
  const descricao  = document.getElementById('dep-descricao').value;
  const forma      = document.getElementById('dep-forma').value;
  const resp       = document.getElementById('dep-responsavel').value;

  if (!data || isNaN(valor) || valor <= 0 || !descricao) { toast('⚠️ Preencha data, valor e descrição'); return; }

  const { error } = await db.from('despesas').insert({
    data, valor, categoria_id: catId, descricao, forma_pagamento: forma, responsavel: resp
  });

  if (error) { toast('Erro ao salvar: ' + error.message); return; }
  toast('✅ Despesa salva!');
  document.getElementById('dep-valor').value = '';
  document.getElementById('dep-descricao').value = '';
  document.getElementById('dep-responsavel').value = '';
}

// ===== HISTÓRICO =====
async function loadHistorico() {
  const mes = document.getElementById('hist-mes').value;
  const { inicio, fim } = mesParaRange(mes);

  const [{ data: entradas }, { data: despesas }] = await Promise.all([
    db.from('entradas').select('*').gte('data', inicio).lte('data', fim).order('data', {ascending:false}),
    db.from('despesas').select('*, categorias(nome)').gte('data', inicio).lte('data', fim).order('data', {ascending:false})
  ]);

  const entEl = document.getElementById('hist-entradas');
  if (!entradas || entradas.length === 0) {
    entEl.innerHTML = '<div class="empty">Nenhuma entrada</div>';
  } else {
    entEl.innerHTML = entradas.map(e => `
      <div class="list-item">
        <div class="item-info">
          <div class="item-title">
            <span class="badge ${e.tipo==='Dízimo'?'badge-blue':'badge-green'}">${e.tipo}</span>
            ${e.nome_dizimista ? ' · ' + e.nome_dizimista : ''}
          </div>
          <div class="item-sub">${fmtDate(e.data)} · ${e.culto}${e.observacao?' · '+e.observacao:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="item-value" style="color:var(--green)">${fmt(e.valor)}</div>
          <button class="btn btn-danger" onclick="deletarEntrada('${e.id}')">✕</button>
        </div>
      </div>`).join('');
  }

  const depEl = document.getElementById('hist-despesas');
  if (!despesas || despesas.length === 0) {
    depEl.innerHTML = '<div class="empty">Nenhuma despesa</div>';
  } else {
    depEl.innerHTML = despesas.map(d => `
      <div class="list-item">
        <div class="item-info">
          <div class="item-title">${d.descricao}</div>
          <div class="item-sub">${fmtDate(d.data)} · ${d.categorias?.nome||'—'} · ${d.forma_pagamento}${d.responsavel?' · '+d.responsavel:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="item-value" style="color:var(--red)">${fmt(d.valor)}</div>
          <button class="btn btn-danger" onclick="deletarDespesa('${d.id}')">✕</button>
        </div>
      </div>`).join('');
  }
}

async function deletarEntrada(id) {
  if (!confirm('Remover esta entrada?')) return;
  await db.from('entradas').delete().eq('id', id);
  toast('Entrada removida');
  loadHistorico();
}
async function deletarDespesa(id) {
  if (!confirm('Remover esta despesa?')) return;
  await db.from('despesas').delete().eq('id', id);
  toast('Despesa removida');
  loadHistorico();
}

// ===== CONFIG =====
async function loadConfig() {
  // Categorias
  const { data: cats } = await db.from('categorias').select('*').order('nome');
  const catEl = document.getElementById('lista-categorias');
  catEl.innerHTML = (cats||[]).length === 0 ? '<div class="empty">Nenhuma categoria</div>' :
    (cats||[]).map(c => `
      <div class="list-item">
        <div class="item-info"><div class="item-title">${c.nome}</div>${c.descricao?`<div class="item-sub">${c.descricao}</div>`:''}</div>
        <button class="btn btn-danger" onclick="deletarCategoria('${c.id}')">✕</button>
      </div>`).join('');

  // Membros
  const { data: mbs } = await db.from('membros').select('*').order('nome');
  const mbEl = document.getElementById('lista-membros');
  mbEl.innerHTML = (mbs||[]).length === 0 ? '<div class="empty">Nenhum membro</div>' :
    (mbs||[]).map(m => `
      <div class="list-item">
        <div class="item-info">
          <div class="item-title">${m.nome}</div>
          <div class="item-sub">${m.ativo ? '<span class="badge badge-green">Ativo</span>' : '<span class="badge badge-amber">Inativo</span>'}</div>
        </div>
        <button class="btn btn-danger" onclick="deletarMembro('${m.id}')">✕</button>
      </div>`).join('');
}

async function adicionarCategoria() {
  const nome = document.getElementById('nova-cat').value.trim();
  if (!nome) return;
  const { error } = await db.from('categorias').insert({ nome });
  if (error) { toast('Erro: ' + error.message); return; }
  document.getElementById('nova-cat').value = '';
  toast('✅ Categoria adicionada');
  loadConfig();
  loadCategoriasSelect();
}

async function deletarCategoria(id) {
  if (!confirm('Remover esta categoria?')) return;
  await db.from('categorias').delete().eq('id', id);
  toast('Categoria removida');
  loadConfig();
}

async function adicionarMembro() {
  const nome = document.getElementById('novo-membro').value.trim();
  if (!nome) return;
  const { error } = await db.from('membros').insert({ nome });
  if (error) { toast('Erro: ' + error.message); return; }
  document.getElementById('novo-membro').value = '';
  toast('✅ Membro adicionado');
  loadConfig();
  loadMembrosSelect();
}

async function deletarMembro(id) {
  if (!confirm('Remover este membro?')) return;
  await db.from('membros').delete().eq('id', id);
  toast('Membro removido');
  loadConfig();
  loadMembrosSelect();
}

// ===== MODAL PDF =====
function abrirModalPDF() {
  const mes = document.getElementById('mes-filtro').value;
  const { inicio, fim } = mesParaRange(mes);
  document.getElementById('pdf-de').value  = inicio;
  document.getElementById('pdf-ate').value = fim;
  document.getElementById('pdf-overlay').classList.add('open');
}
function fecharModalPDF(e) {
  if (!e || e.target === document.getElementById('pdf-overlay')) {
    document.getElementById('pdf-overlay').classList.remove('open');
  }
}

async function gerarPDF() {
  const de   = document.getElementById('pdf-de').value;
  const ate  = document.getElementById('pdf-ate').value;
  const tipo = document.getElementById('pdf-tipo').value;
  if (!de || !ate) { toast('⚠️ Preencha o período'); return; }

  toast('⏳ Gerando PDF...');
  fecharModalPDF();

  const [{ data: entradas }, { data: despesas }] = await Promise.all([
    db.from('entradas').select('*').gte('data', de).lte('data', ate).order('data'),
    db.from('despesas').select('*, categorias(nome)').gte('data', de).lte('data', ate).order('data')
  ]);

  const fmtD = d => d ? new Date(d+'T12:00:00').toLocaleDateString('pt-BR') : '';
  const fmtV = v => 'R$\u00a0' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const tipoLabel = tipo==='entradas' ? 'Somente Entradas' : tipo==='despesas' ? 'Somente Despesas' : 'Entradas e Despesas';

  const totalEnt = (entradas||[]).reduce((s,e)=>s+Number(e.valor),0);
  const totalDep = (despesas||[]).reduce((s,d)=>s+Number(d.valor),0);
  const saldo    = totalEnt - totalDep;

  let linhasEnt = '';
  if (tipo !== 'despesas') {
    (entradas||[]).forEach(e => {
      linhasEnt += `
        <tr>
          <td>${fmtD(e.data)}</td>
          <td>${e.tipo === 'Dízimo' ? (e.nome_dizimista||'Anônimo') : (e.observacao||'—')}</td>
          <td>${e.culto}</td>
          <td>${e.tipo}</td>
          <td class="val-pos">+${fmtV(e.valor)}</td>
        </tr>`;
    });
  }

  let linhasDep = '';
  if (tipo !== 'entradas') {
    (despesas||[]).forEach(d => {
      linhasDep += `
        <tr>
          <td>${fmtD(d.data)}</td>
          <td>${d.descricao}</td>
          <td>${d.categorias?.nome||'—'}</td>
          <td>${d.forma_pagamento||'—'}</td>
          <td class="val-neg">−${fmtV(d.valor)}</td>
        </tr>`;
    });
  }

  const tabelaEnt = tipo !== 'despesas' ? `
    <div class="section-header">Entradas</div>
    <table>
      <thead><tr><th>Data</th><th>Descrição / Dizimista</th><th>Culto</th><th>Tipo</th><th>Valor</th></tr></thead>
      <tbody>${linhasEnt || '<tr><td colspan="5" class="empty-row">Nenhuma entrada no período</td></tr>'}</tbody>
    </table>` : '';

  const tabelaDep = tipo !== 'entradas' ? `
    <div class="section-header">Despesas</div>
    <table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pagamento</th><th>Valor</th></tr></thead>
      <tbody>${linhasDep || '<tr><td colspan="5" class="empty-row">Nenhuma despesa no período</td></tr>'}</tbody>
    </table>` : '';

  const totaisHtml = `
    <div class="totais">
      ${tipo !== 'despesas' ? `<div class="total-row"><span>Total de Entradas:</span><span class="val-pos">${fmtV(totalEnt)}</span></div>` : ''}
      ${tipo !== 'entradas' ? `<div class="total-row"><span>Total de Despesas:</span><span class="val-neg">${fmtV(totalDep)}</span></div>` : ''}
      ${tipo === 'ambos'    ? `<div class="total-row saldo"><span>Saldo:</span><span class="${saldo>=0?'val-pos':'val-neg'}">${fmtV(saldo)}</span></div>` : ''}
    </div>`;

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Extrato — ${NOME_IGREJA}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #1c1c1e; padding: 32px; }
  .header { margin-bottom: 24px; }
  .header h1 { font-size: 22px; font-weight: 700; color: #1c1c1e; }
  .header p  { font-size: 13px; color: #6e6e73; margin-top: 2px; }
  .periodo   { font-size: 12px; color: #6e6e73; margin-top: 12px; border-top: 1px solid #e5e5ea; padding-top: 10px; }
  .section-header {
    background: #16a34a; color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 6px 6px 0 0; margin-top: 20px;
  }
  table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  thead th { background: #f4f4f5; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: #6e6e73; padding: 7px 10px; text-align: left; border-bottom: 1px solid #e5e5ea; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid #f4f4f5; font-size: 12px; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) td { background: #fafafa; }
  .val-pos { color: #16a34a; font-weight: 700; text-align: right; white-space: nowrap; }
  .val-neg { color: #dc2626; font-weight: 700; text-align: right; white-space: nowrap; }
  thead th:last-child { text-align: right; }
  .empty-row { text-align: center; color: #9a9aa0; padding: 16px; }
  .totais { margin-top: 20px; border-top: 2px solid #1c1c1e; padding-top: 12px; }
  .total-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
  .total-row span:first-child { color: #6e6e73; }
  .saldo { font-size: 15px; font-weight: 700; margin-top: 6px; border-top: 1px solid #e5e5ea; padding-top: 8px; }
  .footer { margin-top: 32px; font-size: 11px; color: #9a9aa0; text-align: center; border-top: 1px solid #e5e5ea; padding-top: 12px; }
  @media print { body { padding: 16px; } }
</style>
</head>
<body>
  <div class="header">
    <h1>${NOME_IGREJA}</h1>
    <p>Extrato de Lançamentos</p>
    <div class="periodo">Período: ${fmtD(de)} a ${fmtD(ate)} · ${tipoLabel}</div>
  </div>
  ${tabelaEnt}
  ${tabelaDep}
  ${totaisHtml}
  <div class="footer">Gerado em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
</body>
</html>`;

  const janela = window.open('', '_blank');
  janela.document.write(html);
  janela.document.close();
  setTimeout(() => { janela.focus(); janela.print(); }, 600);
  toast('✅ PDF gerado!');
}

// ===== START =====
init();
</script>
</body>
</html>
